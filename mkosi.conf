[Distribution]
Distribution=debian
Release=trixie
Repositories=contrib,non-free,non-free-firmware

[Output]
Format=disk
ImageId=onprem-host
ImageVersion=0.1.0

[Include]
Include=mkosi-vm

[Content]
Bootloader=systemd-boot-signed
ShimBootloader=signed
Packages=
    apt
    ca-certificates
    curl
    e2fsprogs
    file
    firmware-linux-free
    firmware-misc-nonfree
    man-db
    mokutil
    openssh-server
    parted
    shim-signed
    sudo
    systemd-cryptsetup
    systemd-repart
    tailscale
    vim
Hostname=onprem
Timezone=Europe/Athens
Locale=el_GR.utf8

[Validation]
Checksum=yes
SecureBoot=yes

[Build]
ToolsTree=default
Incremental=yes

[Runtime]
Firmware=uefi-secure-boot
FirmwareVariables=microsoft
